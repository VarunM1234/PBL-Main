<!doctype html>
<!-- SmartRoute authoring copy of the web page. The two lines marked data-smartroute-inject
     are placeholders: `make` (tools/page_gen.cpp) replaces them with web/vendor/leaflet.css
     and web/vendor/leaflet.js - Leaflet 1.9.4, BSD-2-Clause, licence in web/vendor/ - so the
     delivered page is ONE self-contained file with no CDN. Opened without a build, the map
     simply falls back to the SVG schematic. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D8232A" />
  <title>SmartRoute: book the bus, watch it arrive (C/C++ demo)</title>
  <meta name="description" content="SmartRoute: book the bus, watch it arrive. Real-time bus booking, simulated GPS live tracking, waypoint alerts, and operator portal." />
  <meta property="og:title" content="SmartRoute: book the bus, watch it arrive" />
  <meta property="og:description" content="SmartRoute: book the bus, watch it arrive. Real-time bus booking, simulated GPS live tracking, waypoint alerts, and operator portal." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      --bg: #F4F6F4;
      --panel: #FFFFFF;
      --ink: #111A14;
      --muted: #536357;
      --line: #D3DDD5;
      --line-subtle: #E8EFE9;
      --route: #D8232A;
      --route-hover: #B51E26;
      --route-light: #FFF0F0;
      --amber: #D97706;
      --amber-light: #FEF3C7;
      --toll: #DC2626;
      --toll-light: #FEE2E2;
      --seat-selected: #128C55;
      --seat-selected-light: #E4F5EC;
      --seat-available: #FFFFFF;
      --ladies: #C2255C;
      --ladies-light: #FDEAF2;
      --on-route: #FFFFFF;
      --soft: #EDF3EE;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(17, 26, 20, 0.04);
      --shadow-md: 0 4px 12px rgba(17, 26, 20, 0.06);
      --shadow-lg: 0 12px 28px rgba(17, 26, 20, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0D1611;
        --panel: #14221A;
        --ink: #EDF5EE;
        --muted: #95A89A;
        --line: #23352A;
        --line-subtle: #1B2B21;
        --route: #FF626B;
        --route-hover: #F0444D;
        --route-light: #35191B;
        --amber: #FBBF24;
        --amber-light: #36290C;
        --toll: #F87171;
        --toll-light: #381B1B;
        --on-route: #09120D;
        --soft: #1A2C21;
        --seat-selected: #34D399;
        --seat-selected-light: #10231A;
        --seat-available: #1A2C21;
        --ladies: #F472B6;
        --ladies-light: #2E1420;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0D1611;
      --panel: #14221A;
      --ink: #EDF5EE;
      --muted: #95A89A;
      --line: #23352A;
      --line-subtle: #1B2B21;
      --route: #FF626B;
      --route-hover: #F0444D;
      --route-light: #35191B;
      --amber: #FBBF24;
      --amber-light: #36290C;
      --toll: #F87171;
      --toll-light: #381B1B;
      --on-route: #09120D;
      --soft: #1A2C21;
      --seat-selected: #34D399;
      --seat-selected-light: #10231A;
      --seat-available: #1A2C21;
      --ladies: #F472B6;
      --ladies-light: #2E1420;
    }
    *, *::before, *::after { box-sizing: inherit; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.95rem;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, h4, .display-title, .brand-title {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.025em;
      color: var(--ink);
      line-height: 1.15;
    }
    h1 {
      font-weight: 800;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      margin: 0 0 0.85rem 0;
      text-wrap: balance;
    }
    h2 { font-weight: 700; font-size: 1.5rem; margin: 0 0 0.75rem 0; }
    h3 { font-weight: 700; font-size: 1.2rem; margin: 0 0 0.5rem 0; }
    h4 { font-weight: 600; font-size: 1rem; margin: 0 0 0.4rem 0; }
    p { margin: 0 0 1rem 0; }
    a { color: inherit; text-decoration: none; }
    button, input, select {
      font-family: inherit;
      font-size: 0.92rem;
      color: inherit;
    }
    :focus-visible {
      outline: 2px solid var(--route) !important;
      outline-offset: 2px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem;
    }
    /* The live tracker gets the whole window: a map shrunk into a 1200px column
       is the one place where the app's main feature stops being readable. */
    .container-wide {
      max-width: min(1760px, 100%);
      padding-left: clamp(1rem, 2.5vw, 2.5rem);
      padding-right: clamp(1rem, 2.5vw, 2.5rem);
    }
    .box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.35rem;
      box-shadow: var(--shadow-sm);
    }
    .box-interactive {
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .box-interactive:hover {
      border-color: var(--route);
      box-shadow: var(--shadow-md);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 1.15rem;
      font-weight: 700;
      font-size: 0.88rem;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: var(--panel);
      color: var(--ink);
      white-space: nowrap;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:hover {
      border-color: var(--ink);
      background: var(--soft);
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--route);
      color: var(--on-route);
      border-color: var(--route);
    }
    .btn-primary:hover {
      background: var(--route-hover);
      border-color: var(--route-hover);
      color: var(--on-route);
    }
    .btn-warn {
      background: var(--toll);
      color: #fff;
      border-color: var(--toll);
    }
    .btn-amber {
      background: var(--amber);
      color: #000;
      border-color: var(--amber);
    }

    /* Two-or-more-way toggle: Sign in | Register, EN | हिं, corridor picker.
       These buttons shipped with no rule at all, so they rendered as bare words
       ("Sign inRegister") and the Register tab did not look clickable. */
    .segmented-control {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 2px;
      padding: 3px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
    .segmented-btn {
      flex: 1 1 auto;
      padding: 0.4rem 0.9rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .segmented-btn:hover { color: var(--ink); }
    .segmented-btn.active { background: var(--panel); color: var(--route); box-shadow: var(--shadow-sm); }
    .segmented-btn:focus-visible { outline: 2px solid var(--route); outline-offset: 1px; }

    /* Zero-Pill Crisp Badges */
    .chip, .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.015em;
    }
    .chip-green, .badge-green { background: var(--route-light); color: var(--route); border: 1px solid rgba(14, 124, 90, 0.2); }
    .chip-amber, .badge-amber { background: var(--amber-light); color: var(--amber); border: 1px solid rgba(217, 119, 6, 0.25); }
    .chip-red, .badge-red { background: var(--toll-light); color: var(--toll); border: 1px solid rgba(220, 38, 38, 0.2); }
    .chip-soft, .badge-soft { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
    .chip-neutral, .badge-neutral { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }

    /* Direct-route chips under the search form. */
    .corridor-chips .chip {
      background: var(--panel);
      border: 1.5px solid var(--line);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease;
    }
    .corridor-chips .chip:hover { border-color: var(--route); color: var(--route); }
    .corridor-chips .chip.chip-active {
      background: var(--route);
      border-color: var(--route);
      color: #fff;
    }
    /* Active Smart Search filters: the engine's parse stays on screen while it is still applied. */
    .smart-active { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-top: .9rem; padding: .6rem .7rem; border: 1px dashed var(--line); border-radius: var(--radius-sm); background: var(--soft); }
    .smart-active .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: .78rem; padding: .2rem .55rem; border-radius: 999px; }
    .badge-route { background: rgba(14, 124, 90, 0.12); color: var(--route); border: 1px solid rgba(14, 124, 90, 0.25); }
    /* Used by the mini-map's TOLL chip; it was referenced but never defined, so
       toll stops rendered as an unstyled bare word (found 2026-10-18). */
    .badge-toll { background: var(--toll-light); color: var(--toll); border: 1px solid rgba(220, 38, 38, 0.2); }

    /* Ops consoles (driver / admin): trip picker and dense data tables */
    .trip-pick {
      text-align: left;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    .trip-pick:hover { border-color: var(--route); }
    .trip-pick.active { border-color: var(--route); background: var(--route-light); box-shadow: inset 3px 0 0 var(--route); }
    .ops-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .ops-table th {
      text-align: left;
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 0.7rem;
      white-space: nowrap;
    }
    .ops-table td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line-subtle); vertical-align: top; }
    .ops-table tbody tr:last-child td { border-bottom: none; }

    /* Nav - Top Bar Contract */
    .sticky-nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 100;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      min-width: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.88rem;
      font-weight: 600;
      min-width: 0;
    }
    .nav-link {
      padding: 0.4rem 0.2rem;
      position: relative;
      color: var(--muted);
      transition: color 0.15s ease;
      white-space: nowrap;
    }
    .nav-link:hover {
      color: var(--ink);
    }
    .nav-link[aria-current="page"] {
      color: var(--route);
      font-weight: 700;
      border-bottom: 2px solid var(--route);
    }
    .bell-btn {
      position: relative;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .bell-btn:hover {
      border-color: var(--ink);
      background: var(--panel);
    }
    .bell-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--toll);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0 4px;
      border-radius: 4px;
      min-width: 16px;
      text-align: center;
    }
    .notif-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 1.5rem;
      width: 360px;
      max-width: 90vw;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 200;
      padding: 0.85rem;
      display: none;
    }
    .notif-dropdown.show { display: block; }

    /* Toasts & Banners Stack */
    .toast-stack {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 65px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      box-shadow: var(--shadow-lg);
      font-size: 0.88rem;
      font-weight: 600;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .alert-banner {
      border-left: 4px solid var(--route);
    }
    .alert-banner.toll { border-left-color: var(--toll); }
    .alert-banner.halt { border-left-color: var(--amber); }

    @keyframes slideDown {
      from { transform: translateY(-16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Progress Steps */
    .steps-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding: 0.75rem 0 1rem 0;
      margin-bottom: 1.5rem;
      overflow-x: auto;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .step-item.current { color: var(--ink); }
    .step-item.done { color: var(--route); }
    .step-dot {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--line);
      font-size: 0.75rem;
      font-weight: 800;
      background: var(--soft);
      color: var(--muted);
    }
    .step-item.done .step-dot { background: var(--route-light); color: var(--route); border-color: var(--route); }
    .step-item.current .step-dot { background: var(--ink); color: #fff; border-color: var(--ink); }
    .step-line {
      flex: 1;
      height: 1px;
      background: var(--line);
      margin: 0 0.5rem;
      min-width: 20px;
    }

    /* Ruled rows */
    .ruled-row {
      border-top: 1px solid var(--line);
      padding: 1.15rem 0;
    }
    .ruled-row:last-child {
      border-bottom: 1px solid var(--line);
    }

    /* Bus row card */
    .bus-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.25rem;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.4rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
    }
    .bus-card:hover {
      border-color: var(--route);
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 768px) {
      .bus-card { grid-template-columns: 1fr; }
    }

    /* Results layout: a sticky filter column (features + max fare) beside the bus cards. */
    .sr-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1.25rem; align-items: start; }
    @media (max-width: 900px) { .sr-layout { grid-template-columns: minmax(0, 1fr); } }
    .filter-panel { padding: 1.1rem 1.2rem; position: sticky; top: 1rem; }
    @media (max-width: 900px) { .filter-panel { position: static; } }
    .filter-fees { display: flex; flex-direction: column; gap: .35rem; margin-top: .35rem; }
    .filter-check { display: flex; align-items: center; gap: .45rem; font-size: .85rem; color: var(--ink); cursor: pointer; }
    .filter-check input { accent-color: var(--route); }
    .chip-amenity { border: 1px solid var(--line); border-radius: 999px; padding: .15rem .55rem; background: var(--soft); color: var(--muted); font-size: .76rem; }
    .chip-more { border-style: dashed; color: var(--route); }
    .trust-note { margin-top: 1rem; padding-top: .8rem; border-top: 1px solid var(--line-subtle); font-size: .78rem; color: var(--muted); line-height: 1.5; }
    .trust-note .field-label { display: block; margin-bottom: .3rem; }

    /* Seat layouts & live transitions */
    .seat-matrix-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }
    .seat-matrix-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
    }
    .seat-cabin {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 380px;
      margin: 0 auto;
      padding: 1rem 1.15rem 1.25rem;
      border: 1.5px solid var(--line);
      border-radius: 24px 24px 14px 14px;
      background: var(--soft);
    }
    .seat-cab-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .seat-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .seat-row-no {
      width: 18px;
      flex: 0 0 18px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
    }
    .seat-aisle {
      flex: 0 0 22px;
    }
    .seat-btn {
      width: 44px;
      height: 44px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      background: var(--seat-available);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      transition: 
        background-color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
        color 0.18s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px rgba(17, 26, 20, 0.04);
    }
    .seat-btn:hover:not(.locked):not(.booked) {
      border-color: var(--route);
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 3px 8px rgba(14, 124, 90, 0.16);
      z-index: 2;
    }
    .seat-btn:active:not(.locked):not(.booked) {
      transform: scale(0.95);
      transition-duration: 0.08s;
    }
    .seat-btn.window {
      border-top-width: 4px;
      border-top-color: var(--muted);
    }
    .seat-btn.selected {
      background: var(--seat-selected) !important;
      color: var(--on-route) !important;
      border-color: var(--seat-selected) !important;
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(18, 140, 85, 0.32);
      animation: seatSelectPulse 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 3;
    }
    .seat-btn.locked {
      background: repeating-linear-gradient(45deg, var(--amber-light), var(--amber-light) 4px, var(--seat-available) 4px, var(--seat-available) 8px) !important;
      border-color: var(--amber) !important;
      color: var(--amber) !important;
      cursor: not-allowed;
      opacity: 0.85;
      animation: seatLockPulse 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .seat-btn.booked {
      background: var(--line-subtle) !important;
      color: var(--muted) !important;
      border-color: var(--line) !important;
      cursor: not-allowed;
      opacity: 0.65;
      transform: none !important;
    }
    .berth-btn {
      width: 58px;
      height: 72px;
    }
    .seat-btn.ladies {
      background: var(--ladies-light);
      border-color: var(--ladies);
      color: var(--ladies);
    }
    .seat-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.9rem;
      margin-top: 1.15rem;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--line);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .seat-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .legend-chip {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid var(--line);
      background: var(--seat-available);
    }
    .legend-chip.sel { background: var(--seat-selected); border-color: var(--seat-selected); }
    .legend-chip.lock { background: var(--amber-light); border-color: var(--amber); }
    .legend-chip.bk { background: var(--line-subtle); opacity: 0.8; }
    .legend-chip.lady { background: var(--ladies-light); border-color: var(--ladies); }
    .hold-countdown {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
    .seat-note { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; }
    .seat-note-error { color: var(--toll); font-weight: 600; }

    /* Checkout fare panel and boarding-pass QR */
    .checkout-fare-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .fare-line {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.88rem;
    }
    .fare-discount { color: var(--seat-selected); font-weight: 600; }
    .ticket-qr {
      width: 178px;
      height: 178px;
      margin: 0 auto 1.25rem auto;
      border: 2px solid var(--ink);
      padding: 6px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .ticket-qr img { display: block; }

    /*
      The QR column of a pass: the code, the boarding state that code encodes, and the
      stamp that replaces the picture once every seat on it has been scanned. All three
      are inside the print area on purpose - the paper pass has to say exactly what the
      screen says, and a conductor reading a printed ticket sees the same word the
      scanner read.
    */
    .ticket-qr-block { display: grid; gap: 0.5rem; justify-items: center; }
    .ticket-qr-block .ticket-qr { position: relative; margin: 0; }
    .ticket-qr-block .ticket-qr img { transition: opacity 0.3s ease, filter 0.3s ease; }
    .ticket-qr--used img { opacity: 0.25; filter: grayscale(1); }
    .ticket-qr-stamp {
      position: absolute;
      inset: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.3rem 0.4rem;
      border: 2px solid var(--toll);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--toll);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      transform: rotate(-12deg);
    }
    .ticket-qr-state { font-size: 0.74rem; font-weight: 650; text-align: center; color: var(--muted); }
    .ticket-qr-state.is-valid { color: var(--seat-selected); }
    .ticket-qr-state.is-partial { color: var(--amber); }
    .ticket-qr-state.is-used { color: var(--toll); }
    .ticket-seat-dots { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; }
    .ticket-seat-dot {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.1rem 0.42rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .ticket-seat-dot.is-boarded { color: #fff; background: var(--toll); border-color: var(--toll); }
    .ticket-seat-dot.is-open { color: var(--seat-selected); border-color: var(--seat-selected); }

    /* City picker on /search: the offline Indian city directory list that hangs
       under the field when no Maps key is configured. */
    .city-field { position: relative; }
    .city-suggestions {
      position: absolute;
      z-index: 40;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      margin: 0;
      padding: 0.3rem 0;
      list-style: none;
      max-height: 268px;
      overflow-y: auto;
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
    }
    .city-suggestion {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      flex-wrap: wrap;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .city-suggestion.is-active { background: var(--route-light); }
    .city-suggestion-name { font-weight: 700; color: var(--ink); }
    .city-suggestion-state { color: var(--muted); font-size: 0.78rem; }
    .city-suggestion-note {
      color: var(--route);
      font-size: 0.72rem;
      font-weight: 700;
      margin-left: auto;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    /* A city with a real bus to the origin already picked is the one worth tapping,
       so it wears the pill rather than plain coloured text. */
    .city-suggestion-note.is-direct {
      color: #fff;
      background: var(--route);
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
    }
    /* Honest counterweight: the city exists, this origin just has no bus there today. */
    .city-suggestion-note.is-none {
      color: var(--amber);
      font-weight: 600;
      text-transform: none;
    }
    .city-suggestion--empty { color: var(--muted); cursor: default; font-style: italic; }
    .city-suggestion--hint {
      color: var(--muted);
      font-size: 0.72rem;
      cursor: default;
      border-top: 1px solid var(--line);
      margin-top: 0.25rem;
      padding-top: 0.45rem;
    }

    /* Boarding pass: one card, one grid. The QR sits beside the facts instead of
       opening a second stack of the page, and printing gives exactly one card. */
    .ticket-card { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
    .ticket-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }
    .ticket-card-eyebrow { font-size: 0.74rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .ticket-card-title { margin: 0.15rem 0 0; font-size: 1.35rem; font-family: 'Outfit', sans-serif; }
    .ticket-card-sub { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
    .ticket-card-ref { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; text-align: right; }
    .ticket-card-pnr { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 0.95rem; }
    .ticket-card-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem 1.25rem; align-items: start; }
    .ticket-card-body .ticket-qr { margin: 0; }
    .ticket-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.7rem 1rem; margin: 0; background: var(--soft); padding: 0.9rem; border-radius: var(--radius-sm); }
    .ticket-fact { min-width: 0; }
    .ticket-fact dt { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .ticket-fact dd { margin: 0.15rem 0 0; font-size: 0.85rem; font-weight: 700; overflow-wrap: anywhere; }
    .ticket-fact.accent dd { color: var(--route); }
    .ticket-card-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .ticket-card-actions .btn { flex: 1 1 auto; }
    .ticket-card-reminder { display: flex; gap: 0.5rem; align-items: center; font-size: 0.82rem; font-weight: 700; }
    @media (max-width: 560px) {
      .ticket-card-body { grid-template-columns: minmax(0, 1fr); }
      .ticket-card-ref { align-items: flex-start; text-align: left; }
    }
    @media print {
      /* Paper gets the pass and nothing else: no nav, no bell, no buttons. */
      body * { visibility: hidden !important; }
      .ticket-print-area, .ticket-print-area * { visibility: visible !important; }
      .ticket-print-area { position: absolute; top: 0; left: 0; margin: 0 !important; max-width: none !important; }
      /* The boarding stamp and the seat chips are the point of printing a used pass,
         and a browser drops coloured backgrounds unless it is told to keep them. */
      .ticket-print-area { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .ticket-no-print { display: none !important; }
      .sticky-nav, .site-footer { display: none !important; }
    }

    /* Journey rail: departure, a dot for every stop the bus actually makes, arrival.
       It lives on the search card and on a shared trip page, so the stop colours here
       are the ones exported by JourneyRail.tsx and reused by the ticket backdrop. */
    .journey-rail { display: grid; gap: 0.45rem; margin-top: 0.35rem; min-width: 0; }
    .journey-rail-ends { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.7rem; align-items: center; }
    .journey-rail-middle { min-width: 0; padding: 0 0.2rem; }
    .journey-clock { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 0.85rem; color: var(--ink); }
    .journey-place {
      font-size: 0.7rem; color: var(--muted); margin-top: 0.1rem; max-width: 9.5rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .journey-bar { position: relative; height: 6px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); }
    .journey-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; background: linear-gradient(90deg, var(--route-light), var(--route)); transition: width 700ms ease; }
    .journey-dot {
      position: absolute; top: 50%; width: 11px; height: 11px; margin-left: -5.5px;
      transform: translateY(-50%); border-radius: 50%; border: 2px solid var(--panel);
      background: var(--muted); pointer-events: auto;
    }
    .journey-dot-origin, .journey-dot-destination { background: #16a34a; }
    .journey-dot-boarding, .journey-dot-dropping { background: #2563eb; }
    .journey-dot-toll { background: #f59e0b; }
    .journey-dot-restaurant { background: #a855f7; }
    .journey-dot-normal { background: #94a3b8; }
    .journey-meta { text-align: center; margin-top: 0.3rem; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
    .journey-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem; font-size: 0.7rem; color: var(--muted); }
    .journey-legend-item { display: inline-flex; align-items: center; gap: 0.28rem; }
    .journey-legend-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
    .journey-legend-count { margin-left: auto; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    /* Fallback when a trip has no stop data on the search payload yet. */
    .journey-rail-plain { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
    @media (max-width: 560px) {
      .journey-place { max-width: 6rem; }
      .journey-legend-count { margin-left: 0; flex-basis: 100%; }
    }

    /* Crew on the pass: driver and conductor, each with one-tap dialling. */
    .ticket-crew { display: grid; gap: 0.45rem; }
    .ticket-crew-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .ticket-crew-person {
      display: flex; align-items: center; gap: 0.5rem; flex: 1 1 240px; min-width: 0;
      padding: 0.5rem 0.65rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--soft);
    }
    .ticket-crew-role { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
    .ticket-crew-name { font-weight: 700; font-size: 0.84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ticket-crew-call { flex: 0 0 auto; padding: 0.3rem 0.7rem; font-size: 0.76rem; text-decoration: none; }

    /* Vendor console: crew counts, the in-table assignment selects, and the roster. */
    .vendor-crew-summary { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.7rem; }
    .vendor-assign {
      display: block; width: 100%; margin-top: 0.4rem; padding: 0.3rem 0.4rem;
      font: inherit; font-size: 0.75rem; color: var(--ink);
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm);
    }
    .vendor-assign:hover:not(:disabled) { border-color: var(--route); }
    .vendor-assign:disabled { opacity: 0.5; }
    a.vendor-call { color: var(--ink); text-decoration: none; }
    a.vendor-call:hover { color: var(--route); }
    .vendor-crew-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.6rem; }
    .vendor-crew-card {
      display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap;
      padding: 0.6rem 0.7rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--soft);
    }
    .vendor-crew-role { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
    .vendor-guide ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.4rem; font-size: 0.84rem; color: var(--muted); }

    /* Share trip: the control row on a pass and on the tracker, plus the public
       landing page a recipient opens. Nothing here is interactive beyond the buttons. */
    .share-trip { display: grid; gap: 0.5rem; min-width: 0; }
    .ticket-card-actions .share-trip { flex: 1 1 100%; }
    .share-trip-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .share-trip-danger { color: var(--toll); border-color: var(--toll); }
    .share-trip-danger:hover { background: var(--toll-light); border-color: var(--toll); color: var(--toll); }
    .share-trip-input {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px dashed var(--line); border-radius: var(--radius-sm);
      background: var(--soft); color: var(--muted);
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    }
    .share-trip-note { margin: 0; font-size: 0.75rem; color: var(--muted); }
    .shared-trip { display: grid; gap: 1.1rem; }
    .shared-trip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }

    /* Ticket backdrop (build guide §8): the journey drawing sits *behind* the pass as a
       static preview. Two rules make that safe: it is painted under every child, and it
       cannot receive pointer events, so no button on the ticket can ever be intercepted.
       The live, pannable map stays on the tracker — a tile map inside a printed pass would
       fetch images, swallow drags and fight the print stylesheet. */
    .ticket-card--with-map { position: relative; isolation: isolate; overflow: hidden; }
    .ticket-card--with-map > :not(.ticket-backdrop) { position: relative; z-index: 1; }
    .ticket-backdrop {
      position: absolute; top: 0; left: 0; width: 100%; max-width: 100%; height: 300px; z-index: 0;
      pointer-events: none; opacity: 0.42;
      /* Fades out before the facts grid so no glyph sits on a road line. */
      -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.55) 62%, transparent 100%);
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.55) 62%, transparent 100%);
    }
    @media (max-width: 560px) {
      .ticket-backdrop { height: 230px; opacity: 0.34; }
    }
    .ticket-backdrop-grid line { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
    .ticket-backdrop-road { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .ticket-backdrop-road-done { fill: none; stroke: var(--route); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .ticket-backdrop-label { fill: var(--muted); font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; }

    @keyframes seatSelectPulse {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1.02); }
    }
    @keyframes seatLockPulse {
      0% { opacity: 0.65; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.85; transform: scale(1); }
    }

    /* Schematic Map */
    .schematic-svg {
      width: 100%;
      height: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    /* Live Google Map */
    .live-map-shell { display: flex; flex-direction: column; gap: 0.85rem; }
    .live-map-canvas {
      position: relative;
      /* The map is the point of the tracking page: it takes most of the viewport
         instead of sitting in a 420px strip. */
      height: clamp(420px, 70vh, 900px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .live-map-canvas > div { height: 100%; }
    /* Leaflet paints absolutely-positioned panes and controls with high z-indices;
       isolating the frame keeps them inside the map instead of over the header. */
    .live-map-canvas { isolation: isolate; }
    .live-map-leaflet-host {
      width: 100%;
      height: 100%;
      background: var(--soft);
    }
    /* Leaflet puts .leaflet-container on the very element it was given, so the
       selector must compound on one element - a descendant selector never matches.
       Without this, Leaflet's own #ddd shows through while tiles load. */
    .live-map-leaflet-host.leaflet-container { background: var(--soft); font-family: inherit; }
    .live-map-leaflet-host .leaflet-popup-content-wrapper { border-radius: var(--radius-md); }
    /* Dark mode: OSM serves light raster tiles only, so they are inverted back into
       a dark palette instead of blasting white at the reader. Markers and controls sit
       in other panes and keep their own colours. */
    :root[data-theme="dark"] .live-map-leaflet-host .leaflet-tile {
      filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9);
    }
    :root[data-theme="dark"] .live-map-leaflet-host .leaflet-control-attribution {
      background: rgba(16, 28, 21, 0.78);
      color: #a9b7ad;
    }
    :root[data-theme="dark"] .live-map-leaflet-host .leaflet-control-attribution a { color: #8ec5ff; }
    /* Same footprint for the no-API-key SVG fallback, so the page never looks
       smaller when Google Maps is unavailable. */
    .live-map-fallback {
      display: block;
      width: 100%;
      height: clamp(420px, 70vh, 900px);
      min-height: 340px;
      border-radius: var(--radius-md);
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .live-map-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem;
      padding: 0.6rem 0.75rem;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
    .map-toggle { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 600; color: var(--ink); cursor: pointer; }
    .map-toggle input { accent-color: var(--route); cursor: pointer; }
    /* The position read-out that sits above the map. It is a caption, not a warning:
       on a no-key build it is shown for every trip, and a full amber panel read as a
       broken/blank block (especially in dark mode). Neutral panel, amber accent bar. */
    .live-map-unavailable {
      display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
      padding: 0.55rem 0.9rem; font-size: 0.82rem; color: var(--muted);
      background: var(--panel); border: 1px solid var(--line);
      border-left: 4px solid var(--amber); border-radius: var(--radius-sm);
    }
    .live-map-unavailable strong { color: var(--ink); font-size: 0.85rem; }
    .live-map-unavailable p { margin: 0; }
    .live-map-unavailable code { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }
    .map-note { margin: 0; font-size: 0.78rem; color: var(--muted); }
    .bus-pin { display: flex; align-items: center; justify-content: center; font-size: 18px; width: 30px; height: 30px; background: #fff; border: 2px solid #D8232A; border-radius: 50%; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35); }
    /* Live-map toolbar (auto-follow / fit to route) and the lettered stop pins drawn on the road map. */
    .live-map-bar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .live-map-bar .btn { padding: .35rem .8rem; font-size: .82rem; }
    /* Letter tags in the Stops list are the same letters as the map pins, so the two read as one view. */
    .stop-letter-tag { display: inline-block; min-width: 1.35rem; height: 1.35rem; line-height: 1.35rem; padding: 0 .2rem; border-radius: 50%; color: #fff; font: 700 .75rem/1.35rem Outfit, sans-serif; text-align: center; vertical-align: middle; }
    .route-stop-list { list-style: none; margin: .6rem 0 0; padding: 0; }
    .route-stop-list li { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .4rem 0; border-bottom: 1px solid var(--line-subtle); font-size: .88rem; }
    .route-stop-list li > span:last-child { margin-left: auto; }
    .map-follow { display: inline-flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--ink); cursor: pointer; user-select: none; }
    .map-follow input { accent-color: var(--route); width: 16px; height: 16px; }
    .stop-pin { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 2px solid #fff; border-radius: 50%; color: #fff; font: 700 11px/1 Outfit, sans-serif; box-shadow: 0 1px 3px rgba(0, 0, 0, .45); }
    /* A toll plaza is passed through, never stopped at, so it is deliberately not a circle like the halts. */
    .toll-pin { border-radius: 4px; border-style: dashed; font-size: 12px; }
    /* The chip on the map states which tile server answered and whether a routing server supplied the road, so a blank map is never unexplained. */
    .map-chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; padding: .18rem .5rem; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); }
    .map-chip-ok { color: var(--route); font-weight: 700; }
    .map-chip-warn { color: var(--amber); font-weight: 700; }
    .map-chip-bad { color: #D8232A; font-weight: 800; }
    .map-chip-retry { padding: .15rem .5rem; font-size: .72rem; }
    /* ---------- offline map background (web/basemap.json, pane sr-basemap, z-index 150) ----------
       The map canvas this page draws itself when no tile server answers: paper colour, a 2-degree
       grid, every published corridor, a labelled dot per city and a scale bar. Colours come from CSS
       classes rather than inline SVG attributes so the same shapes can be re-tinted for dark mode,
       and so "neutral paper, sea blue only with land data" is one line to read. */
    .bm-leaf { --bm-paper: #F4EEE1; --bm-sea: #CFE0EA; --bm-grid: #DBD2BC; --bm-line: #B9A986;
               --bm-corridor: #8B7B57; --bm-city: #4F4630; background: var(--bm-paper); }
    .bm-leaf.bm-sea { background: var(--bm-sea); }        /* only when the file really contains land outlines */
    .bm-leaf .bm-frame { fill: none; stroke: var(--bm-line); stroke-width: 1; stroke-dasharray: 2 4; }
    .bm-leaf .bm-grid { fill: none; stroke: var(--bm-grid); stroke-width: 1; }
    .bm-leaf .bm-corridor { fill: none; stroke: var(--bm-corridor); stroke-width: 1.8; stroke-dasharray: 7 5; opacity: .9; }
    .bm-leaf .bm-land { fill: var(--bm-paper); fill-opacity: 1; stroke: var(--bm-line); stroke-width: 1; }
    .bm-leaf .bm-scale { fill: none; stroke: var(--bm-city); stroke-width: 2.5; }
    .bm-leaf .bm-dot { display: block; width: 8px; height: 8px; border-radius: 50%;
                       background: var(--bm-city); box-shadow: 0 0 0 2px var(--bm-paper); }
    .bm-leaf .bm-city-name { position: absolute; left: 10px; top: -4px; font: 500 10px/1.1 Outfit, sans-serif;
                             color: var(--bm-city); white-space: nowrap; pointer-events: none; }
    .bm-leaf .bm-scale-text { position: absolute; left: 0; top: -14px; font: 500 10px/1.1 Outfit, sans-serif;
                              color: var(--bm-city); white-space: nowrap; pointer-events: none; }
    /* City names duplicate what a live street map already prints, so they fade out as soon as a
       tile server starts painting. The pane sits below the tiles anyway; this makes the rule explicit. */
    .bm-leaf.bm-tiles-on .bm-city-name, .bm-leaf.bm-tiles-on .bm-scale-text { opacity: 0; }
    :root[data-theme="dark"] .bm-leaf { --bm-paper: #1C231E; --bm-sea: #16242E; --bm-grid: #2A352D; --bm-line: #3E4A3F;
               --bm-corridor: #9C8A5F; --bm-city: #D8CFAE; }
    :root[data-theme="dark"] .bm-leaf .bm-dot { box-shadow: 0 0 0 2px #1C231E; }

    .route-choice-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .route-chip {
      display: flex; flex-direction: column; gap: 0.15rem; align-items: flex-start;
      padding: 0.5rem 0.75rem; min-width: 150px;
      background: var(--panel); color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-md);
      cursor: pointer; font: inherit; text-align: left;
    }
    .route-chip:hover { border-color: var(--route); }
    .route-chip.active { border-color: var(--route); background: var(--route-light); box-shadow: var(--shadow-sm); }
    .route-chip-name { font-size: 0.82rem; font-weight: 700; }
    .route-chip-meta { font-size: 0.74rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    .tracker-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.9rem; }
    .tracker-head-right { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
    .tracker-title { margin: 0; font-size: 1.2rem; font-family: 'Outfit', sans-serif; }
    .tracker-sub { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }

    /* Journey progress rail: 0% at the origin stop, 100% at the terminus. The fill
       width is driven only by telemetry, so it can never run ahead of the bus. */
    .journey-progress { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
    .journey-progress-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
    .journey-progress-percent { display: inline-flex; align-items: center; gap: 0.45rem; font-weight: 800; font-size: 0.88rem; font-family: 'Outfit', sans-serif; color: var(--ink); }
    .journey-progress-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--route); box-shadow: 0 0 0 4px var(--route-light); }
    .journey-progress-meta { font-size: 0.76rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .journey-progress-rail { position: relative; height: 8px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; display: block; }
    .journey-progress-rail--full { height: 11px; }
    .journey-progress-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; background: linear-gradient(90deg, var(--route-light), var(--route)); transition: width 700ms ease; }
    .journey-progress-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
    .journey-progress-tick.passed { background: rgba(255, 255, 255, 0.6); }
    .journey-progress-ends { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.7rem; color: var(--muted); }
    .journey-progress--compact { flex-direction: row; align-items: center; gap: 0.45rem; }
    .journey-progress--compact .journey-progress-rail { flex: 1; min-width: 52px; }
    .journey-progress-value { font-size: 0.72rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--ink); min-width: 36px; text-align: right; }
    /* A run with no GPS report yet is drawn from its timetable. Amber and striped so
       the plan can never be read as an observation, on the rail and in the number. */
    .journey-progress--planned .journey-progress-fill {
      background: repeating-linear-gradient(90deg, var(--amber) 0 5px, var(--amber-light) 5px 10px);
      opacity: 0.85;
    }
    .journey-progress--planned .journey-progress-dot { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-light); }
    .journey-progress--planned .journey-progress-value { color: var(--amber); }
    /* Hollow marker for the timetable position on a rail that has a real fix. */
    .journey-progress-planned { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--amber); opacity: 0.7; }

    /* Stop timeline: replaces the old overlapping SVG text labels */
    .stop-timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
    .stop-row + .stop-row { border-top: 1px solid var(--line-subtle); }
    .stop-row.passed { opacity: 0.55; }
    .stop-row.next { background: var(--route-light); }
    .stop-row.open { background: var(--soft); }
    .stop-row-main {
      display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 0.7rem; align-items: center;
      width: 100%; padding: 0.6rem 0.8rem; background: none; border: 0; cursor: pointer;
      font: inherit; color: var(--ink); text-align: left;
    }
    .stop-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%;
      font-size: 0.72rem; font-weight: 800; color: #fff; background: var(--muted);
    }
    .stop-badge[data-type="ORIGIN"], .stop-badge[data-type="DESTINATION"] { background: #d8232a; }
    .stop-badge[data-type="BOARDING"] { background: #0ea5e9; }
    .stop-badge[data-type="TOLL"] { background: #d97706; }
    .stop-badge[data-type="RESTAURANT"] { background: #a21caf; }
    .stop-badge[data-type="DROPPING"] { background: #7c3aed; }
    .stop-text { display: flex; flex-direction: column; gap: 0.12rem; min-width: 0; }
    .stop-name { font-size: 0.85rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stop-name-hi { font-size: 0.72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stop-meta { font-size: 0.72rem; color: var(--muted); }
    .stop-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; }
    .stop-km { font-size: 0.74rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .stop-eta { font-size: 0.76rem; font-weight: 700; }
    .stop-delay { font-size: 0.7rem; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 999px; }
    .stop-delay.ontime { background: #dcfce7; color: #15803d; }
    .stop-delay.late { background: var(--toll-light); color: var(--toll); }

    .eta-label { font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
    .eta-value { font-size: 1.6rem; font-weight: 800; color: var(--route); font-family: 'Outfit', sans-serif; line-height: 1.25; margin-top: 0.2rem; }
    .eta-sub { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .delay-pill { display: inline-block; margin-top: 0.6rem; padding: 0.25rem 0.65rem; border-radius: 999px; font-size: 0.8rem; font-weight: 800; }
    .delay-pill.ontime { background: #dcfce7; color: #15803d; }
    .delay-pill.late { background: var(--toll-light); color: var(--toll); }
    .delay-note { margin-top: 0.55rem; font-size: 0.78rem; color: var(--amber); font-weight: 600; }

    /* Demo-only GPS simulator rig */
    .simulator-console { padding: 1.25rem; border-style: dashed; }
    .simulator-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 0.85rem; }
    .simulator-head > div:first-child { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.5rem; }
    .simulator-title { font-weight: 700; font-size: 0.95rem; }
    .simulator-sub { flex-basis: 100%; font-size: 0.74rem; color: var(--muted); }
    .demo-pill { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; padding: 0.15rem 0.45rem; border-radius: 4px; background: var(--amber-light); color: var(--amber); border: 1px solid var(--amber); }
    .simulator-actions { display: flex; flex-wrap: wrap; gap: 0.65rem; }
    .simulator-note { margin: 0.85rem 0 0; font-size: 0.74rem; color: var(--muted); }

    .btn-ghost { background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--route); color: var(--route); }

    /* Map | arrival card, as a centred pair. Stretching the map column across the
       whole window pushed it to the left of the screen and made it read as one big
       empty block on a wide monitor, so the corridor is capped at a readable width
       and the group is centred instead of left-anchored. */
    .tracking-layout { display: grid; grid-template-columns: minmax(0, 1060px) 340px; gap: 1.75rem; align-items: flex-start; justify-content: center; }
    /* Lookup and reminder span the top; map | arrival card share the next row.
       The map must come first in placement order: with the arrival card placed
       first in column 2, grid auto-placement cannot step back to column 1 on the
       same row, so the map dropped a whole row and left a big empty dark block
       beside the arrival card (fixed 2026-10-18). On a phone the same order gives
       lookup, MAP, arrival - the drawing is what a traveller opens the page for. */
    .tracking-page-lookup { grid-column: 1 / -1; order: 1; }
    .tracking-reminder { grid-column: 1 / -1; order: 2; }
    .tracking-main { grid-column: 1; order: 3; }
    .tracking-aside { grid-column: 2; order: 4; }
    @media (min-width: 901px) {
      .tracking-aside { position: sticky; top: 1.25rem; }
    }

    @media (max-width: 900px) {
      .tracking-layout { grid-template-columns: minmax(0, 1fr); }
      .tracking-aside, .tracking-main { grid-column: 1; }
      /* Still the dominant element on a phone: a map you cannot read is useless. */
      .live-map-canvas { height: 68vh; min-height: 340px; }
      .live-map-fallback { height: 68vh; min-height: 340px; }
      .stop-name { white-space: normal; }
    }

    /* Corridor mini-map (ticket + route modal) */
    .mini-map-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1.25rem; margin-top: 1.25rem; text-align: left; }
    .mini-map-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; flex-wrap: wrap; gap: 0.5rem; }
    .mini-map-eyebrow { font-size: 0.78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .mini-map-title { font-size: 1.05rem; font-weight: 800; font-family: 'Outfit', sans-serif; }
    .mini-map-badges { display: flex; gap: 0.4rem; align-items: center; }

    .route-rail { display: flex; align-items: center; padding: 1.15rem 0.6rem; background: var(--soft); border: 1px solid var(--line-subtle); border-radius: var(--radius-sm); overflow: hidden; }
    .rail-seg { display: flex; align-items: center; min-width: 0; }
    .rail-seg:last-child { flex-grow: 0; }
    .rail-dot { flex: 0 0 auto; width: 16px; height: 16px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: var(--muted); cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
    .rail-dot.selected { width: 21px; height: 21px; box-shadow: 0 0 0 3px var(--route-light); }
    .rail-dot.dot-origin, .rail-dot.dot-destination { background: #d8232a; }
    .rail-dot.dot-boarding { background: #0ea5e9; }
    .rail-dot.dot-toll { background: #d97706; }
    .rail-dot.dot-restaurant { background: #a21caf; }
    .rail-dot.dot-dropping { background: #7c3aed; }
    .rail-link { display: block; height: 7px; min-width: 12px; background: linear-gradient(90deg, var(--route), var(--amber)); border-radius: 4px; opacity: 0.75; }

    .mini-map-detail { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-top: 0.65rem; padding: 0.65rem 0.85rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 0.82rem; box-shadow: var(--shadow-sm); }
    .mini-map-detail-main { min-width: 0; }
    .mini-map-detail-name { font-weight: 800; display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .mini-map-detail-desc { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
    .mini-map-detail-meta { text-align: right; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.78rem; color: var(--muted); flex: 0 0 auto; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 26, 20, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 2.25rem 1.5rem;
      margin-top: 3.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    html, body, #root {
      width: 100%;
      min-height: 100%;
    }
    body { overflow-x: clip; }
    .brand-button {
      flex: 0 0 auto;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .nav-tools { flex: 0 0 auto; }
    .login-button { border-color: var(--route); color: var(--route); }
    .login-button:hover { background: var(--route-light); border-color: var(--route); color: var(--route); }
    .container { min-width: 0; }
      .landing-content { padding-top: 0.5rem; }
      .landing-section { margin-top: 2.75rem; }
      .landing-section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .landing-section-heading h2 { margin: 0.2rem 0 0; }
      .landing-eyebrow {
        display: block;
        color: var(--route);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .landing-card-grid { display: grid; gap: 1rem; }
      .offers-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .offer-card {
        min-height: 168px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 1.35rem;
        box-shadow: var(--shadow-sm);
      }
      .offer-card h3 { margin: 0.7rem 0 0.4rem; }
      .offer-card p { margin: 0; font-size: 0.84rem; }
      .offer-card-red { color: #fff; background: linear-gradient(135deg, #D8232A, #A91825); border-color: #D8232A; }
      .offer-card-dark { color: #fff; background: linear-gradient(135deg, #19221D, #334239); border-color: #334239; }
      .offer-card-light { background: var(--panel); }
      .offer-code { font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; font-weight: 800; letter-spacing: 0.08em; }
      .route-grid { grid-template-columns: minmax(0, 420px); }
      .route-card {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        column-gap: 0.8rem;
        row-gap: 0.2rem;
        align-items: center;
        padding: 1rem;
        text-align: left;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .route-card:hover { border-color: var(--route); box-shadow: var(--shadow-md); }
      .route-card-icon {
        grid-row: span 3;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        color: var(--route);
        background: var(--route-light);
        border-radius: 50%;
        font-size: 1.25rem;
      }
      .route-card strong { font-size: 0.95rem; }
      .route-card > span:not(.route-card-icon) { color: var(--muted); font-size: 0.78rem; }
      .route-card .route-card-action { color: var(--route) !important; font-weight: 700; }
      .route-card-more { border-style: dashed; }
      .landing-note { color: var(--muted); font-size: 0.78rem; }
      .feature-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .feature-card {
        padding: 1.1rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
      }
      .feature-card > span { color: var(--route); font-size: 1.35rem; font-weight: 800; }
      .feature-card h3 { margin: 0.55rem 0 0.35rem; font-size: 1rem; }
      .feature-card p { margin: 0; color: var(--muted); font-size: 0.82rem; }
      .steps-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        padding: 0;
        list-style: none;
      }
      .steps-grid li { padding: 1.15rem; border-top: 2px solid var(--route); background: var(--panel); }
      .steps-grid li > span { color: var(--route); font-family: 'JetBrains Mono', monospace; font-weight: 800; }
      .steps-grid h3 { margin: 0.55rem 0 0.35rem; }
      .steps-grid p { margin: 0; color: var(--muted); font-size: 0.84rem; }
      .faq-section details { padding: 1rem 0; border-bottom: 1px solid var(--line); }
      .faq-section summary { cursor: pointer; font-weight: 700; }
      .faq-section details p { margin: 0.7rem 0 0; color: var(--muted); font-size: 0.88rem; }
      .track-lookup {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr);
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 1rem;
      }
      .track-lookup h2 { margin: 0.25rem 0; }
      .track-lookup p { margin: 0; color: var(--muted); font-size: 0.85rem; }
      .track-lookup-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.55rem; }
      .track-lookup-form input, .contact-phone-field input {
        width: 100%;
        min-width: 0;
        padding: 0.7rem 0.8rem;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
      }
      .tracking-message { grid-column: 1 / -1; color: var(--toll) !important; }
      .tracking-page-lookup { grid-column: 1 / -1; }
      .contact-phone-field { padding: 1rem; }
      .contact-phone-field label { display: block; margin-bottom: 0.3rem; font-weight: 700; }
      .contact-phone-field p { margin-bottom: 0.65rem; color: var(--muted); font-size: 0.82rem; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .site-footer { margin-top: 2rem; }
      .footer-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1.25rem;
        align-items: center;
      }
      .footer-inner strong { color: var(--ink); font-family: 'Outfit', sans-serif; font-size: 1.15rem; }
      .footer-inner p { margin: 0.3rem 0 0; max-width: 440px; }
      .footer-inner nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.45rem 1rem; }
      .footer-inner nav button {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
      }
      .footer-inner nav button:hover { color: var(--route); }
      .footer-inner > span { grid-column: 1 / -1; padding-top: 0.8rem; border-top: 1px solid var(--line); font-size: 0.78rem; }

<script>

  foundTrip: 0, foundInfo: null, viewerTimer: null, streamSeen: false, depAfter: "", depBefore: "", passes: null, notice: "", smartNote: "", smart: null, smartTypes: "", smartAmenity: "", smartOp: "", fareCap: 0 };

  var fill = travelled == null ? 0 : Math.max(0, Math.min(100, travelled / totalKm * 100));

$("theme").onclick = function () { S.theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; try { localStorage.setItem("sr_theme", S.theme); } catch (e) {} applyTheme(); };

var ROLE_TITLE = { vendor: "Operator sign in", driver: "Driver sign in", admin: "Platform admin sign in" };

  if (S.passes) return S.passes;
  var out = [];
  try { out = JSON.parse(localStorage.getItem("sr.passes") || "[]") || []; } catch (e) { out = []; }

/* ---------- QR code (the C engine encodes it; this only draws the squares) ---------- */
function qrSvg(rows) {
  if (!rows || !rows.length) return "";
  var n = rows.length, q = 4, d = "";
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (rows[y].charAt(x) === "1") d += "M" + (x + q) + " " + (y + q) + "h1v1h-1z";
  return "<svg viewBox='0 0 " + (n + 2 * q) + " " + (n + 2 * q) + "' width='170' height='170' role='img' aria-label='Boarding pass QR code' shape-rendering='crispEdges' style='background:#fff;display:block'><path d='" + d + "' fill='#000'/></svg>";
}

    $("dgo").onclick = async function () { var r = await api("/api/login", { email: $("de").value, password: $("dw").value, role: "driver" }); if (!r.ok) return note("dm", r.error, false); S.token = r.token; try { sessionStorage.setItem("sr_token", r.token); } catch (e) {} await refresh(); viewDriver(m); };
