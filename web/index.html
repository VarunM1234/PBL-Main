  if (!S.drvSel || !trips.some(function (t) { return t.id === S.drvSel; })) S.drvSel = trips.length ? trips[0].id : null;
  m.innerHTML = "<div class='driver-console-layout'><div><h2 style='margin:0 0 .6rem;font-size:1.2rem'>Duty list</h2><div style='display:flex;flex-direction:column;gap:.5rem'>" +
    (trips.length ? trips.map(function (t) { return "<button type='button' class='trip-pick" + (t.id === S.drvSel ? " active" : "") + "' data-t='" + t.id + "'><b>" + esc(t.route) + "</b><br><span class='kv'>" + esc(t.reg) + " \u00B7 " + esc(t.depart) + " \u00B7 " + esc(t.status) + (t.delay ? " \u00B7 +" + t.delay + " min" : "") + "</span></button>"; }).join("") : "<p style='color:var(--muted);font-size:.85rem'>No trips are assigned to you yet.</p>") + "</div></div><div id='dsel'></div></div>";
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (b) { b.onclick = function () { S.drvSel = +b.dataset.t; viewDriver(m); }; });
  if (S.drvSel) drawDriverTrip(trips.filter(function (t) { return t.id === S.drvSel; })[0]); else $("dsel").innerHTML = "<div class='box' style='color:var(--muted)'>Pick a trip to start reporting.</div>";
}
async function drawDriverTrip(t) {
  var r = await Promise.all([api("/api/driver/manifest?trip=" + t.id), api("/api/driver/trail?trip=" + t.id)]);
  if (S.tab !== "driver" || !$("dsel")) return;                       // the user moved to another screen while this loaded
  var man = Array.isArray(r[0]) ? r[0] : [], trail = Array.isArray(r[1]) ? r[1] : [];
  var running = t.status === "RUNNING", sched = t.status === "SCHEDULED";
  $("dsel").innerHTML = "<div class='box' style='margin-bottom:1rem'><div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem'><div><h3 style='margin:0;font-size:1.25rem;font-family:Outfit,sans-serif'>" + esc(t.route) + "</h3><span class='kv'>" + esc(t.operator) + " " + esc(t.reg) + " \u00B7 departs " + esc(t.depart) + "</span></div><div style='display:flex;gap:.5rem'>" +
    (sched ? "<button class='btn btn-primary' id='dst'>Start trip</button>" : "") + (running ? "<button class='btn btn-warn' id='den'>End trip</button>" : "") + "</div></div>" +
    "<div class='stat-row' style='margin-bottom:0'><div class='box'><b>" + esc(t.status) + "</b><small>status</small></div><div class='box'><b>" + Math.round(t.progress) + "%</b><small>" + Math.round(t.km) + " km covered</small></div><div class='box'><b>" + esc(t.est) + "</b><small>estimated arrival" + (t.delay ? " (+" + t.delay + " min)" : "") + "</small></div><div class='box'><b>" + t.booked + "/" + t.seats + "</b><small>seats sold</small></div></div><p id='dmsg' role='alert' style='margin:.6rem 0 0'></p></div>" +
    "<div class='box' style='margin-bottom:1rem'><h3 style='margin:0 0 .7rem;font-size:1rem'>GPS position</h3><p class='kv'>DEMO: there is no real GPS device here. \u201CSend one fix\u201D makes the simulated device report a point 5 km further along the route; or type coordinates yourself (the server checks the ranges and that you are near the route).</p>" +
    "<button class='btn' id='dfix'" + (running ? "" : " disabled") + ">Send one fix now</button><label class='map-follow' style='margin-left:.7rem'><input type='checkbox' id='dauto'" + (S.autoShare === t.id ? " checked" : "") + (running ? "" : " disabled") + "> Auto-share my location</label><span class='kv' id='dautos' style='margin-left:.4rem'>" + (S.autoShare === t.id && running ? "on \u00B7 one fix every 8 s" : "off") + "</span><p class='kv' style='margin:.5rem 0 0'>Auto-share stands in for the driver\u2019s phone: while it is on this console reports one simulated fix every 8 seconds, so the passenger map keeps moving.</p><div class='form-grid' style='margin-top:.8rem;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))'><div><label>Latitude</label><input id='dlat' inputmode='decimal' placeholder='28.6'></div><div><label>Longitude</label><input id='dlng' inputmode='decimal' placeholder='77.2'></div><div><label>km/h</label><input id='dsp' inputmode='decimal' value='45'></div><div><label>Heading</label><input id='dhd' inputmode='decimal' value='90'></div></div><p style='margin:.6rem 0 0'><button class='btn' id='dpos'" + (running ? "" : " disabled") + ">Send coordinates</button></p></div>" +
    "<div class='box' style='margin-bottom:1rem'><h3 style='margin:0 0 .7rem;font-size:1rem'>Report a delay</h3><div class='form-grid'><div><label>Cause</label><select id='drs'><option>TRAFFIC</option><option>WEATHER</option><option>BREAKDOWN</option><option>ROADWORK</option><option>OTHER</option></select></div><div><label>Minutes (1-600)</label><input id='dmn' type='number' min='1' max='600' value='15'></div><div><label>Note</label><input id='dnt' maxlength='240' placeholder='Bottleneck at Ghaziabad flyover'></div></div><p style='margin:.8rem 0 0'><button class='btn btn-primary' id='ddl'>Send alert</button></p></div>" +
    "<div class='box' style='margin-bottom:1rem'><h3 style='margin:0 0 .7rem;font-size:1rem'>Boarding check-in</h3><div style='display:flex;gap:.5rem;flex-wrap:wrap'><input id='dsc' class='inp' style='flex:1;min-width:220px' placeholder='Paste the ticket QR payload (SR|...) or SRxxxxxxxx'><button class='btn btn-primary' id='dvl' disabled>Validate</button><button class='btn' id='dcam'>Scan QR with camera</button></div>" +
    "<div id='dcambox' class='hidden' style='margin-top:.7rem'><video id='dvid' playsinline muted style='width:100%;max-width:360px;border-radius:var(--radius-sm);background:#000'></video><p style='margin:.5rem 0 0'><button class='btn' id='dcamstop'>Stop camera</button></p></div>" +
    "<p class='kv' style='margin:.5rem 0 0'>The camera read uses the browser's own BarcodeDetector. Where a browser has none (desktop Chrome has no such API), the button says so and the paste box stays the way in - nothing is installed and no frame leaves this machine.</p><div id='dscr' role='status' style='margin:.7rem 0'></div>" +
    "<div style='overflow:auto'><table class='ops-table'><thead><tr><th>Seat</th><th>Passenger</th><th>Boarding at</th><th>Booking</th><th>Check-in</th></tr></thead><tbody>" + (man.length ? man.map(function (x) { return "<tr><td><b>" + esc(x.seat) + "</b></td><td>" + esc(x.name) + ", " + x.age + "</td><td>" + esc(x.boarding) + "</td><td>" + esc(x.pnr) + " <span class='badge badge-neutral'>" + esc(x.status) + "</span></td><td>" + (x.checked_in ? "<span class='badge badge-route'>Boarded " + esc(x.checked_at) + "</span>" : "<span class='kv'>waiting</span>") + "</td></tr>"; }).join("") : "<tr><td colspan='5' style='color:var(--muted)'>No passengers booked on this trip yet.</td></tr>") + "</tbody></table></div></div>" +
    "<div class='box'><h3 style='margin:0 0 .7rem;font-size:1rem'>Recent positions</h3>" + (trail.length ? "<div style='overflow:auto'><table class='ops-table'><thead><tr><th>Recorded</th><th>Latitude</th><th>Longitude</th><th>Heading</th><th>km/h</th><th>Accuracy</th></tr></thead><tbody>" + trail.map(function (g) { return "<tr><td>" + esc(g.at) + "</td><td>" + g.lat.toFixed(4) + "</td><td>" + g.lng.toFixed(4) + "</td><td>" + Math.round(g.heading) + "\u00B0</td><td>" + Math.round(g.speed) + "</td><td>" + Math.round(g.accuracy) + " m</td></tr>"; }).join("") + "</tbody></table></div>" : "<p style='color:var(--muted);font-size:.85rem;margin:0'>Nothing stored yet \u2014 send a fix to start the trail.</p>") + "</div>";
  var again = function () { if (S.tab === "driver") viewDriver($("main")); };
  var act = async function (path, body, okmsg) { var x = await api(path, body); if (x.ok) again(); else note("dmsg", x.error, false); };
  var b;
  if ((b = $("dst"))) b.onclick = function () { act("/api/driver/start", { trip: t.id }); };
  if ((b = $("den"))) b.onclick = function () { act("/api/driver/end", { trip: t.id }); };
  $("dfix").onclick = function () { act("/api/driver/simulate-fix", { trip: t.id }); };
  $("dauto").onchange = function () {
    if (!this.checked) { if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; } S.autoShare = 0; $("dautos").textContent = "off"; return; }
    S.autoShare = t.id; $("dautos").textContent = "on \u00B7 one fix every 8 s";
    if (S.autoTimer) clearInterval(S.autoTimer);
    S.autoTimer = setInterval(function () {
      if (S.tab !== "driver" || S.autoShare !== t.id) { clearInterval(S.autoTimer); S.autoTimer = null; S.autoShare = 0; return; }
      var a = document.activeElement, busy = a && a.closest && a.closest("#dsel") && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
      api("/api/driver/simulate-fix", { trip: t.id }).then(function (x) {
        if (!x.ok) { note("dmsg", x.error, false); clearInterval(S.autoTimer); S.autoTimer = null; S.autoShare = 0; return; }
        if (!busy && S.tab === "driver") viewDriver($("main"));        /* never wipe what the driver is typing */
      });
    }, 8000);
  };
  $("dpos").onclick = function () { act("/api/driver/position", { trip: t.id, lat: $("dlat").value, lng: $("dlng").value, speed: $("dsp").value, heading: $("dhd").value, accuracy: 10 }); };
  $("ddl").onclick = function () { act("/api/driver/delay", { trip: t.id, reason: $("drs").value, minutes: $("dmn").value, note: $("dnt").value }); };
  var doScan = async function () {
    var code = $("dsc").value.trim();
    if (code.length < 6) { $("dscr").innerHTML = "<span class='msg-err'>A reference is at least 6 characters - paste the ticket code or scan it.</span>"; return; }
    stopCam();
    var x = await api("/api/driver/scan", { code: code });
    if (!x.found) { $("dscr").innerHTML = "<span class='msg-err'>" + esc(x.error) + "</span>"; return; }
    var mf = x.manifest;
    $("dscr").innerHTML = "<span class='badge badge-route'>" + (x.already ? "Already checked in" : "Checked in") + "</span> <b>" + esc(mf.booking_reference) + "</b> " + mf.seats.map(function (s) { return "<span class='ticket-seat-dot is-boarded'>" + esc(s.seat) + " " + esc(s.name) + "</span>"; }).join(" ");
    setTimeout(again, 900);
  };
  $("dsc").oninput = function () { $("dvl").disabled = this.value.trim().length < 6; };   /* validate only once a real code is in the box */
  $("dvl").onclick = doScan;
  /* Camera check-in. The detector is the browser's (Chrome on Android, Safari with the framework); desktop
     Chrome has none, so the honest answer there is "paste the code" rather than a button that does nothing. */
  var camStream = null, camTimer = null, camDet = null;
  function stopCam() {
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    if (camStream) { camStream.getTracks().forEach(function (tr) { tr.stop(); }); camStream = null; }
    var box = $("dcambox"); if (box) box.className = "hidden";
  }
  $("dcam").onclick = async function () {
    if (!("BarcodeDetector" in window)) return note("dmsg", "This browser cannot read barcodes (no BarcodeDetector), so use the paste box - the code is printed under the QR on the ticket.", false);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return note("dmsg", "No camera access from this page (it needs https or localhost).", false);
    try { camDet = camDet || new window.BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { return note("dmsg", "The browser's barcode decoder could not start.", false); }
    try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); }
    catch (e) { return note("dmsg", "The camera was refused or is busy - use the paste box instead.", false); }
    $("dcambox").className = "";
    var v = $("dvid"); v.srcObject = camStream;
    try { await v.play(); } catch (e) { /* some browsers want a gesture; the loop below still reads frames */ }
    camTimer = setInterval(async function () {
      if (!$("dvid")) return stopCam();
      try { var codes = await camDet.detect($("dvid")); } catch (e) { return; }
      if (codes && codes.length) { $("dsc").value = codes[0].rawValue; $("dvl").disabled = false; doScan(); }
    }, 450);
  };
  $("dcamstop").onclick = stopCam;
  S.camStop = stopCam;                                                    /* leaving the screen must not leave the camera running */
}

/* ---------- Trip assistant (rule-based, no AI service) ---------- */
function viewAssistant(m) {
  if (!S.chat) S.chat = [{ who: "bot", text: "Hi! Ask me for a bus, for example \"cheapest bus from Delhi to Jaipur tomorrow\". I am a rule-based helper (no AI service): I understand cities, dates, and words like cheapest, fastest, morning or sleeper." }];
  var draw = function () {
    $("chat").innerHTML = S.chat.map(function (c) { return "<div style='display:flex;justify-content:" + (c.who === "me" ? "flex-end" : "flex-start") + ";margin:.5rem 0'><div style='max-width:80%;padding:.6rem .8rem;border-radius:var(--radius-md);white-space:pre-line;background:" + (c.who === "me" ? "var(--route)" : "var(--soft)") + ";color:" + (c.who === "me" ? "var(--on-route)" : "var(--ink)") + "'>" + esc(c.text) + (c.open ? "<div style='margin-top:.5rem'><button class='btn btn-primary' data-open='" + c.open + "'>Open in Search</button></div>" : "") + "</div></div>"; }).join("");
    Array.prototype.forEach.call($("chat").querySelectorAll("[data-open]"), function (b) { b.onclick = function () { var c = S.chat[+b.dataset.open]; applyParse(c.p || { from: c.from, to: c.to, date: c.date }); S.autoSearch = true; S.stage = "home"; go("search"); }; });
    $("chat").scrollTop = $("chat").scrollHeight;
  };
  m.innerHTML = "<h2 style='font-family:Outfit,sans-serif;font-size:1.5rem'>Trip assistant</h2><p class='kv'>Rule-based helper: it reads your sentence with fixed rules and answers from the real search and journey planner. It is not artificial intelligence.</p>" +
    "<div class='box'><div id='chat' style='max-height:420px;overflow:auto'></div><form id='af' style='display:flex;gap:.5rem;margin-top:.8rem'><input id='aq' class='inp' autocomplete='off' placeholder='e.g. fastest sleeper bus from Mumbai to Goa +3' style='flex:1'><button class='btn btn-primary' type='submit'>Ask</button></form>" +
    "<div class='corridor-chips' style='display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.8rem'>" + ["cheapest bus from Delhi to Jaipur tomorrow", "fastest way from Mysuru to Madurai", "morning bus Delhi to Agra today", "buses from Mumbai"].map(function (q) { return "<button type='button' class='chip' data-q='" + esc(q) + "'>" + esc(q) + "</button>"; }).join("") + "</div></div>";
  draw();
  var ask = async function (text) {
    if (!text.trim()) return;
    S.chat.push({ who: "me", text: text }); draw();
    var r = await api("/api/assistant", { text: text });
    S.chat.push({ who: "bot", text: r.text || r.error, open: r.open_search ? S.chat.length : 0, from: r.from, to: r.to, date: r.date, p: r }); draw();
  };
  $("af").onsubmit = function (e) { e.preventDefault(); var v = $("aq").value; $("aq").value = ""; ask(v); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-q]"), function (b) { b.onclick = function () { ask(b.dataset.q); }; });
}

/* ---------- shared trip page (public, read-only) ---------- */
async function viewShared(token) {

  if (!d.track) { m.innerHTML = "<div class='box' style='max-width:560px;margin:2rem auto'><h2 style='margin-top:0'>Shared trip</h2><p class='msg-err'>" + esc(d.error || "This link is not available.") + "</p><p class='kv'>The owner may have stopped sharing, or the booking was cancelled.</p></div>"; return; }
  var t = d.track, first = t.stops[0], last = t.stops[t.stops.length - 1];
  m.innerHTML = "<div class='shared-trip'><span class='badge badge-amber'>DEMO SIMULATION</span><h2 style='font-family:Outfit,sans-serif;font-size:1.5rem;margin:.4rem 0'>" + esc(d.route) + "</h2><p class='kv'>" + esc(d.operator) + " \u00B7 " + esc(d.type) + " \u00B7 departs " + esc(d.depart) + ". Someone shared this trip with you; it shows no passenger details.</p>" +
    "<div class='box'>" + rail(t.stops, t.total_km, "", "", Math.round(t.progress) + "% \u00B7 " + Math.round(t.km_left) + " km left", first.name, last.name, t.km) + "<div id='shlmp'></div>" + "</div>" +
    "<div class='stat-row'><div class='box'><b>" + esc(t.estimated) + "</b><small>estimated arrival (scheduled " + esc(t.scheduled) + ")</small></div><div class='box'><b>" + (t.delay > 0 ? "+" + t.delay + " min" : "on time") + "</b><small>difference</small></div><div class='box'><b>" + Math.round(t.speed) + " km/h</b><small>" + (t.on_break ? "on a break" : "current speed") + "</small></div><div class='box'><b>" + esc(t.status) + "</b><small>trip status</small></div></div><button class='btn' id='shr'>Refresh</button></div>";
  $("shr").onclick = function () { viewShared(token); };

  box.innerHTML = current ? "<div class='box' style='margin-top:.8rem'><div class='field-label'>Anyone with this link can watch this trip (no passenger details)</div><div style='display:flex;gap:.5rem;flex-wrap:wrap'><input class='inp' id='k_link' readonly value='" + esc(link) + "' style='flex:1;min-width:240px'><button class='btn' id='k_copy'>Copy</button><button class='btn' id='k_rot'>New link</button><button class='btn btn-warn' id='k_stop'>Stop sharing</button></div></div>" : "";

}

applyTheme();
Array.prototype.forEach.call(document.querySelectorAll(".footer-inner nav button"), function (b) { b.onclick = function () { go(b.dataset.tab); }; });
(async function () {
  var tok = new URLSearchParams(location.search).get("share");          // a shared trip link opens the public read-only page
  await refresh();
  if (tok) return viewShared(tok);
  render();
})();
</script>
</body>
</html>
